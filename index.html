<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quản Lý Thu Chi</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.0/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.0/build/stlite.js"></script>
    <script>
      stlite.mount(
        {
          // Đã thêm "sqlite3" vào danh sách thư viện
          requirements: ["pandas", "altair", "sqlite3"],
          entrypoint: "app.py",
          files: {
            "app.py": { url: "./app.py" },
            // Khai báo file database nếu ứng dụng dùng file finance.db
            "finance.db": { url: "./finance.db" }
          }
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
